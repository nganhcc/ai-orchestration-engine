services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orchestration
      POSTGRES_USER: orchestration
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestration"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  orchestrator-a:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestration
      SPRING_DATASOURCE_USERNAME: orchestration
      SPRING_DATASOURCE_PASSWORD: devpassword
      SPRING_DATA_REDIS_HOST: redis
      RAFT_NODE_ID: orchestrator-a
      RAFT_PORT: 7000
      RAFT_BIND_HOST: 0.0.0.0
      RAFT_PEERS: orchestrator-b=orchestrator-b:7000,orchestrator-c=orchestrator-c:7000
      ORCHESTRATOR_RPC_PORT: 9000
      ORCHESTRATOR_RPC_BIND_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "7001:7000"
      - "9001:9000"

  orchestrator-b:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestration
      SPRING_DATASOURCE_USERNAME: orchestration
      SPRING_DATASOURCE_PASSWORD: devpassword
      SPRING_DATA_REDIS_HOST: redis
      RAFT_NODE_ID: orchestrator-b
      RAFT_PORT: 7000
      RAFT_BIND_HOST: 0.0.0.0
      RAFT_PEERS: orchestrator-a=orchestrator-a:7000,orchestrator-c=orchestrator-c:7000
      ORCHESTRATOR_RPC_PORT: 9000
      ORCHESTRATOR_RPC_BIND_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "7002:7000"
      - "9002:9000"

  orchestrator-c:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestration
      SPRING_DATASOURCE_USERNAME: orchestration
      SPRING_DATASOURCE_PASSWORD: devpassword
      SPRING_DATA_REDIS_HOST: redis
      RAFT_NODE_ID: orchestrator-c
      RAFT_PORT: 7000
      RAFT_BIND_HOST: 0.0.0.0
      RAFT_PEERS: orchestrator-a=orchestrator-a:7000,orchestrator-b=orchestrator-b:7000
      ORCHESTRATOR_RPC_PORT: 9000
      ORCHESTRATOR_RPC_BIND_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "7003:7000"
      - "9003:9000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      # For local Docker desktop, connect to the host-mapped orchestrator RPC port
      ORCHESTRATOR_HOST: host.docker.internal
      ORCHESTRATOR_PORT: 9001
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestration
      SPRING_DATASOURCE_USERNAME: orchestration
      SPRING_DATASOURCE_PASSWORD: devpassword
    depends_on:
      orchestrator-a:
        condition: service_started
    links:
      - orchestrator-a

volumes:
  pgdata:
